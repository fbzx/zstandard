name: Miri

# Miri interprets the crate and reports undefined behavior on inputs that
# already work — a pointer computed out of bounds, a read of uninitialized
# memory, a slice accessed past its provenance. None of that is visible to
# `cargo test`, to clippy, or to a fuzzer, because on real hardware these
# almost always produce the right answer right up until an inlining decision
# changes. The first run of this against zstandard found six, five of them on the
# decode path.
#
# It runs weekly rather than on every push. A full pass takes around twenty
# minutes, which is too much to put in front of every change, and the defects it
# finds are latent rather than the kind a normal CI run would catch anyway: all
# six of the first batch had been in the tree for a long time, passing the whole
# suite. This is a sweep for what has accumulated, not a gate on a change.
#
# There are two legs. The first interprets `tests/miri.rs` on the host, which
# is 64-bit and is where nearly all of the coverage is. The second interprets a
# handful of unit tests for a 32-bit target, because the unsafe code in the
# entropy layer is the one part of this crate whose bounds arithmetic depends
# on the width of a pointer; the comment on that job says why the wasm32 leg of
# the ordinary CI run does not cover the same ground.
#
# Run it directly on anything that touches `unsafe` rather than waiting for
# Sunday — `gh workflow run miri.yml`, or the Actions tab.

on:
  schedule:
    # 04:00 UTC on Sundays, well clear of the daily fuzz run at 06:00.
    - cron: "0 4 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Miri's own incremental cache went pathological during development here:
  # a rebuild after editing `src/sequence.rs` sat at 100% CPU and 6.9 GB for
  # over an hour, where a clean build of the same tree takes about a minute.
  # Nothing is gained by incremental compilation in a job that starts cold.
  CARGO_INCREMENTAL: 0
  # The upstream parity harness shells out to `git`, `cc`, and a compiled
  # helper. Miri cannot spawn processes, so those tests skip themselves;
  # isolation is off because the harness reads environment variables to work
  # out that it should.
  MIRIFLAGS: -Zmiri-disable-isolation

jobs:
  miri:
    name: miri (undefined behavior)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri

      # `tests/miri.rs` is the target sized for an interpreter: small bodies,
      # small blocks, and `flush` to reach block boundaries the encoder would
      # never choose on its own. The rest of the suite uses bodies of 128 KiB
      # and up, which Miri needs many minutes apiece to walk — running it here
      # would buy very little coverage for a great deal of wall clock.
      #
      # Around 20 minutes on a developer machine, most of it the two level
      # sweeps. If that grows, shrink the bodies in `tests/miri.rs` before
      # dropping levels: Miri's cost is superlinear in body size at btopt and
      # btultra, while the levels are the coverage.
      - name: cargo miri test
        run: cargo miri test --test miri -- --test-threads=1

  miri-32-bit:
    name: miri (undefined behavior, 32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-unknown-linux-gnu
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-i686

      # Why a 32-bit leg at all: the bit container, the unaligned word helpers
      # it loads through, and the pointer arithmetic that walks the bitstream
      # backwards are the only code here whose bounds depend on the width of a
      # pointer. When the container was `usize` rather than `u64`, a 32-bit
      # build read eight bytes after a four-byte bounds check and flushed eight
      # where four were reserved. Both are memory unsafety, and both were
      # invisible to every job in this repository, because the job above runs on
      # the host and the host is 64-bit.
      #
      # Why the wasm32 job in `ci.yml` is not a substitute: wasm32 bounds-checks
      # the module's linear memory, not the allocation. A read or write a few
      # bytes past a `Vec` lands in whatever else the allocator has placed
      # there, so it returns the wrong bytes or corrupts a neighbour rather than
      # faulting. Wasmtime proves the 32-bit paths run and agree with the
      # 64-bit ones; it cannot see the defect that made them wrong. Only the
      # `debug_assert!`s in `src/entropy/bitstream.rs` and this job can.
      #
      # Why a filter rather than `--lib`: cost. These fourteen tests take about
      # four seconds under the interpreter, so what this job spends is Miri's
      # sysroot build for the target and not the testing. The rest of the unit
      # tests are minutes apiece — `entropy::huff0` takes nine, and
      # `entropy::hist` had not finished after ten — and none of them are
      # width-sensitive, so their coverage does not pay for the wall clock.
      # Widen the filter when a module grows unsafe code whose bounds are a
      # function of `usize::BITS`. Do not widen it to `--lib`, and do not
      # interpret `tests/miri.rs` a second time for a second target: that is the
      # twenty minutes the job above already spends.
      #
      # Folded rather than a plain scalar because a filter ending in `::` puts a
      # colon before a space, which YAML reads as the start of a mapping.
      - name: cargo miri test (i686)
        run: >-
          cargo miri test --target i686-unknown-linux-gnu --lib --
          --test-threads=1 entropy::bitstream:: entropy::mem:: entropy::fse::
