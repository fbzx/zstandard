  <line x1="66" y1="112.2" x2="406" y2="112.2" class="parity"/>
  <path d="M66.0,112.2 L82.2,112.2 L98.4,112.2 L114.6,112.2 L130.8,112.2 L147.0,112.2 L163.1,112.2 L179.3,112.2 L195.5,112.2 L211.7,112.2 L227.9,112.2 L244.1,112.2 L260.3,112.2 L276.5,112.2 L292.7,112.2 L308.9,112.2 L325.0,112.2 L341.2,112.2 L357.4,112.2 L373.6,112.2 L389.8,112.2 L406.0,112.2" class="lineA"/>
  <text x="74" y="102.2" class="note">identical to zstd</text>
  <text x="402" y="286.7" class="note end">band: best and worst of the 11 corpora</text>
  <text x="534" y="54" class="ptitle">Throughput vs zstd</text>
  <text x="534" y="73" class="psub">higher is better &#8212; percentage of upstream on the same bytes</text>
  <line x1="534" y1="94.0" x2="874" y2="94.0" class="grid"/>
  <text x="526" y="98.0" class="ytick">125%</text>
  <line x1="534" y1="165.4" x2="874" y2="165.4" class="grid"/>
  <text x="526" y="169.4" class="ytick">100%</text>
  <line x1="534" y1="236.9" x2="874" y2="236.9" class="grid"/>
  <text x="526" y="240.9" class="ytick">75%</text>
  <line x1="534" y1="294.0" x2="874" y2="294.0" class="grid"/>
  <text x="526" y="298.0" class="ytick">55%</text>
  <line x1="534" y1="294" x2="874" y2="294" class="axis"/>
  <text x="534.0" y="314" class="xtick">1</text>
  <text x="598.8" y="314" class="xtick">5</text>
  <text x="679.7" y="314" class="xtick">10</text>
  <text x="760.7" y="314" class="xtick">15</text>
  <text x="874.0" y="314" class="xtick">22</text>
  <text x="704" y="336" class="axlabel">compression level</text>
  <line x1="534" y1="165.4" x2="874" y2="165.4" class="parity"/>
  <text x="540.0" y="187.7" class="note">parity with zstd</text>
  <path d="M534.0,132.9 L550.2,124.0 L566.4,167.3 L582.6,174.7 L598.8,175.6 L615.0,171.6 L631.1,175.6 L647.3,181.3 L663.5,181.1 L679.7,158.9 L695.9,156.4 L712.1,150.3 L728.3,160.2 L744.5,153.4 L760.7,148.5 L776.9,144.6 L793.0,156.8 L809.2,134.1 L825.4,140.6 L841.6,116.4 L857.8,130.9 L874.0,124.8" class="lineA"/>
  <path d="M534.0,167.6 L550.2,165.0 L566.4,158.3 L582.6,165.6 L598.8,157.4 L615.0,157.0 L631.1,165.1 L647.3,162.1 L663.5,162.9 L679.7,170.1 L695.9,167.1 L712.1,165.4 L728.3,165.2 L744.5,168.9 L760.7,166.8 L776.9,182.6 L793.0,173.8 L809.2,186.7 L825.4,184.6 L841.6,185.2 L857.8,185.1 L874.0,182.1" class="lineB"/>
